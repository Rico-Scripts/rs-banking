<!doctype html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RS ATM</title><link rel="stylesheet" href="style.css"></head><body><main id="atm" class="hidden"><header><div class="logo">RS</div><div><b>RS BANKING</b><small>Veilige pinautomaat</small></div><button id="close">×</button></header><section id="auth"><p class="label" id="authLabel">Voer je pincode in</p><div id="dots" class="dots"><i></i><i></i><i></i><i></i></div><div class="keys" id="keys"></div><button class="secondary" id="pinAction">Inloggen</button></section><section id="panel" class="hidden"><div class="balance"><span>Beschikbaar saldo</span><strong id="balance">€0</strong><small id="cash">Contant: €0</small></div><div class="actions"><button data-view="withdraw">↓<span>Opnemen</span></button><button data-view="deposit">↑<span>Storten</span></button><button data-view="pin">••<span>Pincode</span></button></div><form id="moneyForm" class="hidden"><h3 id="formTitle">Bedrag opnemen</h3><div class="money"><b>€</b><input name="amount" type="number" min="1" required></div><small id="fee"></small><button class="primary">Bevestigen</button><button type="button" class="secondary" id="cancel">Annuleren</button></form></section><div id="message"></div></main><script src="app.js"></script></body></html>
